<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add a new note</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
</head>
<body>
<div class="container col-6">
    <h2 class="text-center">Add a new note for the patient <span th:text="${#strings.concat(patient.firstname, ' ', patient.lastname)}"/></h2>

    <form th:action="@{/note/save}" th:object="${note}" method="post">
        <input type="hidden" name="patId" th:value="${patient.id}"/>

        <table class="table table-bordered border border-dark">
            <tbody>
            <tr>
                <td>Note</td>
                <td>
                    <textarea th:field="*{note}" placeholder="Enter the note about your patient" class="form-control" required></textarea>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="text-center mt-3">
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/patient/{id}(id=${patient.id})}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
