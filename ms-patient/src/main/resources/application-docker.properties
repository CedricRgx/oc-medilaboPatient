# Name of the Spring Boot application
spring.application.name=ms-patient

# Logging level for the root logger
logging.level.root=INFO

# Port for the ms-patient microservice
server.port=8081

# Eureka client configuration
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.fetch-registry=false
eureka.client.register-with-eureka=true

# Database connection configuration for MySQL
spring.datasource.url=jdbc:mysql://${APP_DB_HOST}:${APP_DB_PORT}/${APP_DB_NAME}?createDatabaseIfNotExist=TRUE
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Sets the default date format for JSON responses and HTTP requests
spring.mvc.format.date=yyyy-MM-dd

# Security credentials for the application
security.username=${PATIENT_USERNAME}
security.password=${PATIENT_PASSWORD}

# Sets the base URL for the ms-gateway service
feign.client.ms-gateway.url=http://ms-gateway-server:8082