spring.application.name=ms-note
logging.level.root=INFO

# Port for the ms-note microservice
server.port=8083

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=false
eureka.client.register-with-eureka=true

security.username=${NOTE_USERNAME}
security.password=${NOTE_PASSWORD}

feign.note.username=${MSNOTE-FEIGN_USERNAME}
feign.note.password=${MSNOTE-FEIGN_USERNAME}

#TODO à mettre en variable d'environnement
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=medilabopatient
spring.data.mongodb.auto-index-creation=true