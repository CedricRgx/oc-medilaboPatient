# Name of the Spring Boot application
spring.application.name=ms-note

# Logging level for the root logger
logging.level.root=INFO

# Port for the ms-note microservice
server.port=8083

# Eureka client configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=false
eureka.client.register-with-eureka=true

# Endpoint management settings
management.endpoints.web.exposure.include=health,info
management.endpoints.web.exposure.exclude=metrics,threaddump

# Security credentials for the application
security.username=${NOTE_USERNAME}
security.password=${NOTE_PASSWORD}

# Logging configuration for Feign clients
logging.level.feign=INFO

# Feign client configuration
feign.note.username=${MSNOTE-FEIGN_USERNAME}
feign.note.password=${MSNOTE-FEIGN_PASSWORD}

# MongoDB database configuration
spring.data.mongodb.host=${MONGO_HOST}
spring.data.mongodb.port=${MONGO_PORT}
spring.data.mongodb.database=${MONGO_DATABASE}
spring.data.mongodb.auto-index-creation=true

# Sets the base URL for the ms-gateway service
feign.client.ms-gateway.url=http://localhost:8082