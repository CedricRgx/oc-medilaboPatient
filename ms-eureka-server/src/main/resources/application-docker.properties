# Port for the ms-eureka-server microservice
server.port=8761

# Eureka configuration
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.instance.hostname=localhost
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/

# Logging configuration for Eureka
logging.level.com.netflix.discovery=INFO
logging.level.com.netflix.loadbalancer=INFO
logging.level.org.springframework.cloud.netflix.eureka=INFO
logging.level.org.springframework.cloud.openfeign=INFO